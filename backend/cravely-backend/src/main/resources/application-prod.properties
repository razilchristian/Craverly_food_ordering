# ===================================================================
# Cravely Backend - Production Profile (SPRING_PROFILES_ACTIVE=prod)
# Targeted for Render + Managed Cloud MySQL 8
# ===================================================================

# Server Configuration (Render assigns PORT dynamically)
server.port=${PORT:8081}

# Managed MySQL Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Cloud Pool Settings
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate Safety: Never alter/drop schemas in production
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS Allowed Origins for Production (e.g. https://cravely.vercel.app)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.vercel.app}

# JWT Production Security
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Razorpay Production Credentials (Test Mode or Live Mode)
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}
razorpay.currency=${RAZORPAY_CURRENCY:INR}

